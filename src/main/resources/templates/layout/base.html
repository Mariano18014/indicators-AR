<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndicadoresAR</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/chart-theme.js}"></script>
</head>
<body>
<header class="app-header">
    <h1>IndicadoresAR</h1>
    <nav class="app-nav" id="appNav">
        <a href="/dashboard">Dashboard</a>
        <a href="/indicators/compare">Comparar</a>
        <a href="/monitoring">Monitoreo</a>
    </nav>
</header>
<main class="page" th:replace="${content}">
</main>
<footer class="app-footer">
    <p>Indicadores económicos argentinos &mdash; BCRA &amp; INDEC</p>
</footer>
<div th:replace="${scripts} ?: ~{}"></div>
<script>
    (function highlightActiveNavLink() {
        const links = document.querySelectorAll('#appNav a');
        links.forEach(function (link) {
            if (window.location.pathname === link.getAttribute('href')) {
                link.classList.add('active');
            }
        });
    })();
</script>
</body>
</html>
