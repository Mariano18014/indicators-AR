<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content}, ~{::scripts})}">
<body>
<div th:fragment="content">
    <a class="back-link" href="/dashboard">&larr; Volver al dashboard</a>
    <div class="page-header">
        <h2>Comparar indicadores</h2>
    </div>

    <form class="filter-form" method="get" action="/indicators/compare">
        <div class="form-field">
            <label>Indicador 1</label>
            <select name="code1">
                <option th:each="ind : ${indicators}" th:value="${ind.code}" th:text="${ind.name + ' (' + ind.code + ')'}"
                        th:selected="${ind.code == code1}">Indicador</option>
            </select>
        </div>
        <div class="form-field">
            <label>Indicador 2</label>
            <select name="code2">
                <option th:each="ind : ${indicators}" th:value="${ind.code}" th:text="${ind.name + ' (' + ind.code + ')'}"
                        th:selected="${ind.code == code2}">Indicador</option>
            </select>
        </div>
        <div class="form-field">
            <label>Desde</label>
            <input type="date" name="from" th:value="${from}">
        </div>
        <div class="form-field">
            <label>Hasta</label>
            <input type="date" name="to" th:value="${to}">
        </div>
        <div class="form-field">
            <button class="btn" type="submit">Comparar</button>
        </div>
    </form>

    <div class="chart-container">
        <canvas id="compareChart"></canvas>
        <div id="noDataMessage" class="empty-state" style="display:none;">Sin datos para uno o ambos indicadores en este período</div>
        <p id="sparseDataNotice" class="card-meta" hidden>
            Uno de los indicadores todavía tiene un solo valor histórico, por eso su línea de tendencia no se ve completa todavía.
        </p>
    </div>
</div>

<div th:fragment="scripts">
<script th:inline="javascript">
    const code1 = /*[[${code1}]]*/ 'DOLAR_OFICIAL';
    const code2 = /*[[${code2}]]*/ 'IPC_NACIONAL';
    const from = /*[[${from != null ? from.toString() : null}]]*/ null;
    const to = /*[[${to != null ? to.toString() : null}]]*/ null;

    function buildHistoryUrl(code, from, to) {
        let url = '/api/indicators/' + code + '/history';
        const params = new URLSearchParams();
        if (from) params.append('from', from);
        if (to) params.append('to', to);
        const query = params.toString();
        return query ? url + '?' + query : url;
    }

    async function fetchHistory(code, from, to) {
        const url = buildHistoryUrl(code, from, to);
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch ' + code);
        return response.json();
    }

    function buildLabels(hist1, hist2) {
        const dates = new Set();
        hist1.forEach(item => dates.add(item.date));
        hist2.forEach(item => dates.add(item.date));
        return Array.from(dates).sort();
    }

    function mapByDate(history) {
        const map = new Map();
        history.forEach(item => map.set(item.date, item.value));
        return map;
    }

    function buildDatasets(hist1, hist2, labels) {
        const map1 = mapByDate(hist1);
        const map2 = mapByDate(hist2);
        const data1 = labels.map(date => map1.get(date) ?? null);
        const data2 = labels.map(date => map2.get(date) ?? null);
        return [
            buildLineDataset(code1, data1, 0, { fill: false, yAxisID: 'y' }),
            buildLineDataset(code2, data2, 1, { fill: false, yAxisID: 'y1' }),
        ];
    }

    function renderCompareChart(hist1, hist2) {
        const canvas = document.getElementById('compareChart');
        const noData = document.getElementById('noDataMessage');
        if (hist1.length === 0 && hist2.length === 0) {
            canvas.style.display = 'none';
            noData.style.display = 'block';
            return;
        }
        if (hist1.length === 0) console.warn('Sin datos para ' + code1);
        if (hist2.length === 0) console.warn('Sin datos para ' + code2);
        const labels = buildLabels(hist1, hist2);
        const datasets = buildDatasets(hist1, hist2, labels);
        const ctx = canvas.getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: buildAxisOptions('Fecha'),
                    y: Object.assign(buildAxisOptions(code1), { position: 'left' }),
                    y1: Object.assign(buildAxisOptions(code2), { position: 'right', grid: { drawOnChartArea: false } }),
                },
            },
        });
    }

    function showSparseDataNoticeIfNeeded(hist1, hist2) {
        const notice = document.getElementById('sparseDataNotice');
        if (!notice) return;
        const bothEmpty = hist1.length === 0 && hist2.length === 0;
        const bothHaveTrendLine = hist1.length >= 2 && hist2.length >= 2;
        notice.hidden = bothEmpty || bothHaveTrendLine;
    }

    (async function initCompareChart() {
        try {
            const [hist1, hist2] = await Promise.all([fetchHistory(code1, from, to), fetchHistory(code2, from, to)]);
            renderCompareChart(hist1, hist2);
            showSparseDataNoticeIfNeeded(hist1, hist2);
        } catch (e) {
            console.error('Error loading compare', e);
        }
    })();
</script>
</div>
</body>
</html>
