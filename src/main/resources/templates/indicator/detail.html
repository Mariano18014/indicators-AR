<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content}, ~{::scripts})}">
<body>
<div th:fragment="content">
    <a class="back-link" href="/dashboard">&larr; Volver al dashboard</a>
    <div class="page-header">
        <h2 th:text="${indicator.name}">Indicador</h2>
        <div class="card-meta">
            <span th:text="${indicator.code}">CODE</span> &mdash;
            <span th:text="${indicator.unit}">unit</span> &mdash;
            <span th:text="${indicator.source}">source</span> &mdash;
            <span th:text="${indicator.frequency}">frequency</span>
        </div>
        <p th:if="${indicator.description != null}" th:text="${indicator.description}">Descripción</p>
    </div>

    <div th:if="${history.isEmpty()}" class="chart-container empty-state">
        Sin datos históricos para este período
    </div>

    <div th:if="${!history.isEmpty()}" class="chart-container">
        <canvas id="historyChart"></canvas>
        <p id="sparseDataNotice" class="card-meta" hidden>
            Todavía hay un solo valor histórico para este indicador. La línea de tendencia va a aparecer a medida que se acumulen más datos.
        </p>
    </div>
</div>

<div th:fragment="scripts">
<script th:inline="javascript">
    const code = /*[[${indicator.code}]]*/ 'DOLAR_OFICIAL';
    const from = /*[[${from != null ? from.toString() : null}]]*/ null;
    const to = /*[[${to != null ? to.toString() : null}]]*/ null;

    function buildHistoryUrl(code, from, to) {
        let url = '/api/indicators/' + code + '/history';
        const params = new URLSearchParams();
        if (from) params.append('from', from);
        if (to) params.append('to', to);
        const query = params.toString();
        return query ? url + '?' + query : url;
    }

    async function fetchHistory(code, from, to) {
        const url = buildHistoryUrl(code, from, to);
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch history');
        return response.json();
    }

    function buildChartData(history) {
        const labels = history.map(item => item.date);
        const values = history.map(item => item.value);
        return { labels, values };
    }

    function renderChart(history) {
        const canvas = document.getElementById('historyChart');
        if (!canvas || history.length === 0) return;
        const data = buildChartData(history);
        const ctx = canvas.getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [buildLineDataset(code, data.values, 0)],
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                },
                scales: {
                    x: buildAxisOptions('Fecha'),
                    y: buildAxisOptions('Valor'),
                },
            },
        });
    }

    function showSparseDataNoticeIfNeeded(history) {
        const notice = document.getElementById('sparseDataNotice');
        if (!notice) return;
        notice.hidden = history.length >= 2;
    }

    (async function initChart() {
        try {
            const history = await fetchHistory(code, from, to);
            if (history.length === 0) return;
            renderChart(history);
            showSparseDataNoticeIfNeeded(history);
        } catch (e) {
            console.error('Error loading history', e);
        }
    })();
</script>
</div>
</body>
</html>
