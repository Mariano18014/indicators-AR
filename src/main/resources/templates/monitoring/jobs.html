<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content}, ~{})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h2>Estado de jobs de ingesta</h2>
    </div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}">Mensaje</div>
    <div class="table-wrapper">
        <table class="table">
            <thead>
                <tr>
                    <th>Job</th>
                    <th>Estado</th>
                    <th>Última ejecución</th>
                    <th>Exit code</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="job : ${jobs}">
                    <td th:text="${job.jobName()}">jobName</td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${job.lastStatus() == 'COMPLETED'} ? 'status-badge--completed' : (${job.lastStatus() == 'FAILED'} ? 'status-badge--failed' : 'status-badge--unknown')"
                              th:text="${job.lastStatus()}">
                            COMPLETED
                        </span>
                    </td>
                    <td th:text="${job.lastExecutionTime() != null ? #temporals.format(job.lastExecutionTime(), 'dd/MM/yyyy HH:mm') : '—'}">01/01/2026 12:00</td>
                    <td th:text="${job.lastExitCode() != null ? job.lastExitCode() : '—'}">COMPLETED</td>
                    <td>
                        <form th:action="@{/monitoring/jobs/{jobName}/run(jobName=${job.jobName()})}" method="post">
                            <button class="btn" type="submit">Ejecutar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
