server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/indicadoresar}
    username: ${SPRING_DATASOURCE_USERNAME:indicadoresar}
    password: ${SPRING_DATASOURCE_PASSWORD:indicadoresar}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.lob.non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  batch:
    job:
      enabled: false
  retry:
    max-attempts: 3
    backoff:
      initial-interval: 1000
      multiplier: 2.0
      max-interval: 5000
  aop:
    auto: true

  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

bcra:
  api:
    base-url: https://api.bcra.gob.ar
    interest-rate-variable: "7"
    reserves-variable: "1"

indec:
  api:
    base-url: https://apis.datos.gob.ar/series/api/series/
    ipc-series-id: "148.3_INIVELNAL_DICI_M_26"
    format: "json"

logging:
  level:
    com.indicadoresar: INFO
    org.springframework.batch: INFO
