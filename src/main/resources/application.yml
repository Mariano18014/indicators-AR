server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/indicadoresar}
    username: ${SPRING_DATASOURCE_USERNAME:indicadoresar}
    password: ${SPRING_DATASOURCE_PASSWORD:indicadoresar}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.lob.non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

bcra:
  api:
    base-url: https://api.bcra.gob.ar
    exchange-rate-variable: "1"
    interest-rate-variable: "6"
    reserves-variable: "13"

logging:
  level:
    com.indicadoresar: INFO
    org.springframework.batch: INFO
