services:
  db:
    image: postgres:16-alpine
    container_name: indicadoresar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: indicadoresar
      POSTGRES_USER: indicadoresar
      POSTGRES_PASSWORD: indicadoresar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indicadoresar -d indicadoresar"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: indicadoresar-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/indicadoresar
      SPRING_DATASOURCE_USERNAME: indicadoresar
      SPRING_DATASOURCE_PASSWORD: indicadoresar
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

volumes:
  pgdata:
